name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GIT_AUTH: https://x-access-token:${{ secrets.SHARED_READ_TOKEN }}@github.com/
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Let npm fetch the private shared package
        run: |
          git config --global url."$GIT_AUTH".insteadOf "https://github.com/"
          git config --global --add url."$GIT_AUTH".insteadOf "ssh://git@github.com/"
      - run: npm ci --no-audit --no-fund
      # Orbit: tokenite kontrast + range toorvärvi-skänn (0 hex/rgb public/-is, campaigns.html viidi tokenitele 23.09)
      # + ratchet (font-size/letter-spacing/radius) + olematu var(--orbit-*) kõva viga.
      - name: Orbit tokens (contrast, monochrome, dist drift, no raw colour in public/)
        run: node node_modules/@leisson/shared/orbit-tokens/verify.mjs --scan public
      - name: orbit-drift (raw-value ratchet vs orbit-drift.baseline.json)
        run: node node_modules/@leisson/shared/tools/orbit-drift.mjs --scan public --baseline orbit-drift.baseline.json
      # pdftotext is a REQUIRED dependency of the document-reader gate, not a convenience:
      # its absence once produced silent NULL requirements and a wrong verdict (hank 315437, 21.09.2026).
      - name: Install pdftotext (poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # --range: in CI every dependency exists, so a SKIPPED gate means silent coverage loss -> red.
      - name: Deterministic fixture gates (no mailbox, model or SMTP)
        run: npm run varav:range
      - name: Validate project skills
        run: python3 tools/validate-skills.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0: css-ab võrdleb PR-i baasiga ja gate-css-ab kasutab #15 ajalugu fikstuurina.
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Let npm fetch the private shared package
        run: |
          git config --global url."$GIT_AUTH".insteadOf "https://github.com/"
          git config --global --add url."$GIT_AUTH".insteadOf "ssh://git@github.com/"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser gates (VALJAJATED list, isolated HTTP fixtures)
        run: npm run varav:brauser
      - name: UI-värav (test/gate.mjs)
        run: node test/gate.mjs
      # Iga font-size/font-family muutus public/{app,agent,crm2}.css-is peab olema PR-i
      # css-ab.plan.json-is kirjas (siht → delta px); plaanita PR = puhas refaktor = 0 erinevust.
      - name: css-ab (computed style, PR vs baas)
        if: github.event_name == 'pull_request'
        run: node tools/css-ab.mjs --base origin/${{ github.base_ref }} --head HEAD
